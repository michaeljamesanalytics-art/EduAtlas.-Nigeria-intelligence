/* EduAtlas Nigeria — no framework, no tracking, local-only learner notes. */
(()=>{
'use strict';
const D=window.EDUATLAS || {updates:[],stakeholders:[],funds:[],timeline:[],policies:[],sources:[],reviewed:'unknown'};
const A=window.EDUATLAS_ACADEMY||{tracks:[],sources:[],glossary:[]};
const INITIAL_DAILY=window.EDUATLAS_DAILY||{};
const ROUTES=[['overview','◈','Overview'],['daily','◷','Daily 7am brief'],['updates','◷','Intelligence feed'],['policies','▤','Policy tracker'],['power','♧','People & power'],['system','⌘','System map'],['money','₦','Follow the money'],['history','◴','History & context'],['learning','▣','Learning academy'],['glossary','≡','Glossary'],['sources','↗','Source library'],['action','✦','Get involved']];
const LESSONS=[
 {title:'The purpose and structure of education',level:'Foundation',summary:'Discover what education should produce and how the system is organized.',body:[['Start with the outcomes','A school enrolment count is not a learning outcome. Education systems pursue access, foundational knowledge, productive skills, civic formation, equity, and opportunities for further study. Each purpose needs different measures.'],['Map the levels','Nigeria includes early childhood education, primary school, junior and senior secondary, technical/vocational routes, and tertiary institutions. Government, communities and non-state providers play different roles at each level.'],['A first investigative question','When someone announces an education reform, ask: which learners and schools are affected, what changes in daily instruction, and what evidence would demonstrate improvement?']],question:'Can you distinguish a policy target, an activity, an output and a learning outcome?'},
 {title:'A guided history of Nigerian education',level:'Historical context',summary:'Build a chronological understanding before evaluating the present.',body:[['Education before colonial schooling','Nigerian societies had Indigenous knowledge systems, apprenticeships and Islamic education traditions before European colonial schooling. History should not be reduced to a single colonial starting date.'],['Regional expansion','Colonial ordinances shaped formal schooling administration, and post-war regional governments experimented with different approaches. The Western Region introduced free primary education in 1955.'],['National frameworks','The 1969 curriculum conference informed the 1977 National Policy on Education. The nationwide UPE programme began in 1976. UBE was launched in 1999 and the 2004 Act placed the programme on a statutory footing.']],question:'Which historical policy is most directly connected to today’s UBEC–state funding arrangement?'},
 {title:'Who really has authority?',level:'Governance',summary:'Understand the different powers of federal, state, agency and school leaders.',body:[['National policy is only one layer','The Federal Ministry of Education sets and coordinates major national policies. Specialist bodies such as UBEC, NERDC, NUC, TRCN, and TETFund have distinct roles.'],['State and local delivery','State governments, SUBEBs, education authorities, and school leaders handle substantial parts of basic education delivery. Therefore, a federal announcement may not immediately change any particular school.'],['The power test','For any issue, locate (1) who sets the rule, (2) who funds it, (3) who implements it, and (4) who assesses the result. These may be different actors.']],question:'If a public primary school lacks teachers, which level of government and local institutions should you investigate first?'},
 {title:'From announcement to classroom',level:'Policy analysis',summary:'Learn to separate ambitions from real implementation.',body:[['Policy stages','A proposal can move through consultation, adoption, budget provision, procurement, delivery, and evaluation. A launch ceremony is not the same as implementation.'],['Define the unit of change','A new curriculum requires teachers, textbooks, time, assessment alignment and supervision. A technology initiative requires electricity, devices, access, support and safe data use.'],['The evidence ladder','Collect original policy documents, official implementation records, financial reports, independent evaluations and classroom results. Record exactly what each source verifies and what remains unknown.']],question:'How would you verify that a revised curriculum changed what children learn—not just what textbooks say?'},
 {title:'Follow the money: five checkpoints',level:'Public finance',summary:'Track approved budgets to demonstrable learning improvements.',body:[['1. Budget approved','An appropriation is permission or a plan to spend within a defined period and institution. For external finance, an approved credit is not the same as a federal budget allocation.'],['2. Funds released','Verify when funds were actually made available to implementing agencies, and distinguish commitments from cash disbursements.'],['3. Funds utilized','Check expenditures, transaction dates and audit records. They may differ from releases.'],['4. Outputs delivered','Verify that classrooms, equipment, training, or services exist, are functional and reach the intended users.'],['5. Learning outcomes','Test whether learners acquired stronger skills. Be careful about attributing improvements to spending without a credible comparison or evaluation design.']],question:'If a ministry announces ₦5 billion for labs but schools receive none yet, which checkpoint has actually been confirmed?'},
 {title:'What counts as trustworthy data?',level:'Data literacy',summary:'Avoid being misled by impressive but incomplete statistics.',body:[['Check the denominator','A reporting portal covering 50% of listed schools cannot automatically represent the entire national school system without weighting and additional validation.'],['Check the time period','A 2022 proficiency score is not automatically a 2026 score. Always label year, population, geography and measurement method.'],['Check the claim','A programme reaching 100,000 people may refer to registrations, attendance or completions. Ask for definitions, validation and outcome follow-up.']],question:'Why is a graph of schools with data different from a graph of all schools?'},
 {title:'Why the classroom and the economy connect',level:'Systems thinking',summary:'Understand school-to-work transition without confusing unemployment with learning failure.',body:[['Foundations compound','Poor early reading can reduce later science comprehension and technical competence. Effective early instruction can create long-run learning advantages.'],['Skills are not jobs','Practical training is important, but jobs also depend on broader economic conditions, investment, enterprise growth and infrastructure.'],['Multiple pathways matter','Secondary technical tracks, apprenticeships, polytechnics, universities, research institutions and lifelong learning must work together while preserving learner mobility.']],question:'What evidence would separate poor curriculum relevance from a weak labour market?'},
 {title:'Your first local education investigation',level:'Practical research',summary:'Turn curiosity into a small ethical, evidence-based project.',body:[['Choose a specific question','For example: Is a local school receiving the reading resources it is entitled to, and how are they used? Avoid identifying individual pupils without consent and a legal basis.'],['Collect public information','Read the UBE Act, relevant state education plans, budget reports, school census data, and official programme documents. Request clarification respectfully through lawful channels.'],['Observe and verify','With school permission, use aggregated data and nonintrusive observation. Compare official records with material conditions; note uncertainty and avoid accusing people without evidence.'],['Publish a constructive brief','Write a one-page brief with the problem, evidence, responsible institution, feasible options, data limitations and specific questions for follow-up.']],question:'Can you write one question about a local school that is specific, measurable and respectful of student privacy?'}
];

const matches=(...txt)=>!S.search||txt.join(' ').toLowerCase().includes(S.search.toLowerCase());
function persist(){try{localStorage.setItem(storeKey,JSON.stringify({completed:S.completed,following:S.following,notes:S.notes,studyCompleted:S.studyCompleted,studyNotes:S.studyNotes}))}catch(_){}}
function shell(page){document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandmark">E</div><div><b>EduAtlas<span style="color:#58c9ba">.</span></b><small>Nigeria intelligence</small></div></div><div class="nav-group">Explore & understand</div><div class="nav-links">${ROUTES.map(r=>`<button class="nav-link ${S.route===r[0]?'active':''}" data-route="${r[0]}"><span class="n-icon">${r[1]}</span><span>${r[2]}</span></button>`).join('')}</div><div class="side-foot"><span class="safe">● Research + learning atlas</span><div class="edition">Reviewed ${datefmt(D.reviewed)}<br>National overview · Nigeria<br>No claim of complete real-time coverage.</div></div></aside><main class="main"><div class="topbar"><div class="breadcrumbs">EDUATLAS <span>›</span> <strong>${e(ROUTES.find(r=>r[0]===S.route)[2])}</strong></div><div class="top-right"><label class="search-wrap"><span class="mini-icon">⌕</span><input id="globalSearch" placeholder="Search within this page…" value="${attr(S.search)}" aria-label="Search this page"></label><span class="date-tag">Research: ${datefmt(D.reviewed)}</span></div></div><div class="content" id="view">${page}<div class="footerline"><span>EduAtlas Nigeria · An independent educational research prototype, not an official government service.</span><span>Claims and leadership reviewed ${datefmt(D.reviewed)} · No automated verification implied.</span></div></div></main></div><div class="drawer" id="drawer"><div class="drawer-backdrop" data-close="1"></div><section class="drawer-panel" id="drawerBody" role="dialog" aria-modal="true" aria-label="Evidence detail"></section></div>`;}
function heading(over,title,sub){return `<div class="eyebrow">${over}</div><h1 class="page-title">${title}</h1><p class="page-subtitle">${sub}</p>`}
function section(title,extra='',sub=''){return `<div class="section-heading"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>${extra}</div>`}
function updateRow(u){return `<div class="update" data-update="${attr(u.id)}" role="button" tabindex="0"><div class="u-date"><b>${e(u.date.slice(8)||'—')}</b><small>${e(month(u.date))}</small></div><div><div class="row-wrap">${badge(u.topic,u.status==='Unreviewed discovery'?'gold':'')}${badge(u.agency,'gray')}</div><div class="u-title">${e(u.headline)}</div><div class="u-sub">${e(u.status)} · ${datefmt(u.date)}</div></div><span class="u-arrow">›</span></div>`}
function updatesAll(){return [...D.updates,...S.auto].sort((a,b)=>b.date.localeCompare(a.date))}
function overview(){const recent=updatesAll().slice(0,3);return `<div class="hero"><div class="eyebrow">Understand the system · Follow the evidence</div><h1>Understand the whole system.<br>Follow what changes each day.</h1><p>A research desk for anyone who wants to understand Nigeria’s education system—its history, leaders, programmes, money, and measurable results.</p><div class="hero-actions">${nav('learning','Begin the 65-lesson academy →')}${nav('daily','See the 7am intelligence desk →','btn secondary')}</div></div><div style="height:18px"></div><div class="grid four"><div class="stat-card"><div class="top">Curated development records</div><div class="num">${D.updates.length}</div><div class="foot">Verified links; not total national activity</div></div><div class="stat-card"><div class="top">Institutions & leadership entries</div><div class="num">${D.stakeholders.length}</div><div class="foot">Current names where sourced</div></div><div class="stat-card"><div class="top">Policy programmes followed</div><div class="num">${D.policies.length}</div><div class="foot">Status must be verified over time</div></div><div class="stat-card"><div class="top">Your learning progress</div><div class="num">${S.studyCompleted.length}/${A.tracks.reduce((n,t)=>n+t.lessons.length,0)}</div><div class="foot">Saved locally on this device</div></div></div>${section('The intelligence lens','', 'Six questions behind every education headline')}<div class="grid three">${[['01','What changed?','Separate new policies from repeated statements.'],['02','Who is responsible?','Identify the decision-maker, funder, implementer and evaluator.'],['03','Who is affected?','Define the students, teachers, schools and communities involved.'],['04','Where is the money?','Trace approvals, releases, utilization and delivered work.'],['05','What is the evidence?','Distinguish activities from independent learning outcomes.'],['06','What can I do?','Move from curiosity to constructive and ethical participation.']].map(x=>`<div class="card"><div class="eyebrow">${x[0]}</div><h3 style="margin-top:11px">${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>${section('Recent developments',`<a href="#updates" data-route="updates">Open full feed ↗</a>`,'Official records and research updates in the curated starter edition')}<div class="update-list">${recent.map(updateRow).join('')}</div>${section('How the system connects',`<a href="#power" data-route="power">Explore decision-makers ↗</a>`)}<div class="card"><div class="chain">${[['Federal policy','FME'],['Programme & standards','UBEC · NERDC'],['State delivery','SUBEB · States'],['Local execution','LGEA · schools'],['Evidence','Census · assessment']].map((x,i)=>`${i?'<span class="arrow">›</span>':''}<div class="node"><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div><p style="margin-top:15px">This is one simplified basic-education pathway. Actual legal authority, funding streams and institutional relationships are more complex.</p></div>${section('The evidence rule')}<div class="notice warn"><strong>Approved ≠ released ≠ spent ≠ delivered ≠ learned.</strong> This prototype never fills missing financial or learning-outcome data with invented figures. ${nav('money','Follow the money →','btn light')}</div>`}
function updates(){const topics=['All topics',...new Set(updatesAll().map(u=>u.topic))];let arr=updatesAll().filter(u=>(S.topic==='All topics'||u.topic===S.topic)&&matches(u.headline,u.summary,u.agency,u.topic));return `${heading('Monitoring room','Education intelligence feed','Curated developments with a source, a date, an institution, an evidence status, and a question about what should happen next.')}<div class="notice warn" style="margin-bottom:16px"><strong>Research edition:</strong> The curated items below are a selected, dated source set—not all current Nigerian education updates. Automated feed discoveries, where available, are clearly marked unreviewed.</div><div class="selectrow"><select class="field" id="topicFilter" aria-label="Filter by topic">${topics.map(t=>`<option ${S.topic===t?'selected':''}>${e(t)}</option>`).join('')}</select><span class="counter">${arr.length} records</span></div><div class="update-list">${arr.map(updateRow).join('')||'<div class="empty">No developments match this filter. Try another term.</div>'}</div>`}
function policies(){let arr=D.policies.filter(p=>matches(p.title,p.agency,p.stage,p.why,p.area));return `${heading('Policy observatory','What has been promised—and what has changed?','Follow a reform from its announced intention to evidence of actual adoption, funding, delivery and learning outcomes.')}<div class="grid two">${arr.map(p=>`<article class="card policy"><div class="row-between">${badge(p.area)}<span class="tiny">Since ${e(p.since)}</span></div><h3>${e(p.title)}</h3><p>${e(p.why)}</p><div style="margin-top:12px">${badge(p.stage,'gold')}</div><div class="details"><strong>Lead institution:</strong> ${e(p.agency)}<br><strong>Evidence still needed:</strong> ${e(p.whatNext)}</div><div class="bottom">${source(p.url)}</div></article>`).join('')||'<div class="empty">No matching policy.</div>'}</div><div class="notice" style="margin-top:20px">A programme can be both real and incompletely implemented. Status labels here describe the specific documentary evidence entered—not a claim about every state or school.</div>`}
function power(){let cat=['All roles',...new Set(D.stakeholders.map(s=>s.category))];let arr=D.stakeholders.filter(s=>(S.actor==='All roles'||s.category===S.actor)&&matches(s.person,s.role,s.organization,s.scope,s.responsibility));return `${heading('Stakeholder directory','People, institutions & actual authority','A starting directory of influential institutions and publicly named officeholders. Names are dated: always verify before writing or contacting someone.')}<div class="card" style="margin-bottom:22px"><h3>Basic education: a simplified responsibility chain</h3><div class="chain" style="margin-top:13px">${[['FME','Federal policy'],['UBEC','Federal basic-ed support'],['State Govt / SUBEB','State delivery'],['LGEA / Schools','Local implementation']].map((x,i)=>`${i?'<span class="arrow">›</span>':''}<div class="node"><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div><p style="margin-top:14px">Parallel institutions shape curriculum, teacher registration, examinations, university regulation, technical training and financing.</p></div><div class="selectrow"><select class="field" id="actorFilter">${cat.map(t=>`<option ${S.actor===t?'selected':''}>${e(t)}</option>`).join('')}</select><span class="counter">${arr.length} entries</span></div><div class="grid three">${arr.map(s=>`<article class="card stake-card"><div class="persona"><span class="avatar">${e(s.person.split(' ').filter(Boolean).slice(-2).map(x=>x[0]||'').join('').toUpperCase())}</span><div><b>${e(s.person)}</b><small>${e(s.role)}</small></div></div><div class="row-wrap">${badge(s.category)}${badge(s.scope,'gray')}</div><div class="detail"><strong style="color:#253d52">${e(s.organization)}</strong><br>${e(s.responsibility)}</div><div class="qa"><b>Question to investigate</b><br>${e(s.question)}</div><div class="linkarea">${source(s.url,'Verify office & institution ↗')}</div></article>`).join('')||'<div class="empty">No matching stakeholder.</div>'}</div><div class="notice warn" style="margin-top:20px">For state education ministries, SUBEB chairpersons, commissioners and local officials, the right names depend on the selected state and current appointments. This first version deliberately does not guess them.</div>`}
function money(){let f=D.funds.find(f=>f.id===S.fund)||D.funds[0];return `${heading('Public-finance observatory','Follow the money. Then the learning.','A budget is only the first checkpoint. This tool keeps missing evidence visible instead of converting announcements into results.')}<div class="selectrow"><select id="fundSelect" class="field" aria-label="Select funding programme">${D.funds.map(x=>`<option value="${e(x.id)}" ${f.id===x.id?'selected':''}>${e(x.title)}</option>`).join('')}</select></div><div class="card"><div class="row-between" style="align-items:start;flex-wrap:wrap"><div><div class="eyebrow">Programme evidence trace</div><h3 style="font-size:21px;margin:9px 0">${e(f.title)}</h3><p>${e(f.agency)} · ${e(f.period)}</p></div>${badge(f.amount,'blue')}</div><div class="fund-steps">${f.stages.map((st,i)=>`<div class="fund-step"><div class="stepnum">STEP ${String(i+1).padStart(2,'0')}</div><strong>${e(st.step)}</strong><div class="value ${st.value?'':'unknown'}">${st.value?e(st.value):'Not verified'}</div><p>${e(st.note)}</p></div>`).join('')}</div>${source(f.url,'Inspect official record ↗')}</div>${section('Understand the five financial measures')}<div class="grid two">${[['Budget approved','What the authority has planned or authorized to spend—not money necessarily received.'],['Funds released','What money has become available to the implementing institution.'],['Funds utilized','What was actually spent, ideally verifiable in statements and audit records.'],['Outputs delivered','What classrooms, services, materials or training were actually provided and are functioning.'],['Learning outcomes','Whether learners acquired more literacy, numeracy, competencies or other validated educational gains.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><div class="notice warn" style="margin-top:19px">No ratio or progress percentage is calculated when a denominator or disbursement record has not been verified. Federal figures must not be presented as total national education expenditure without accounting for states and other sources.</div>`}
function history(){let arr=D.timeline.filter(x=>matches(x.year,x.title,x.body));return `${heading('Historical atlas','How did we get here?','Understanding current reforms requires knowing the older choices, institutions and persistent problems they inherited. This is a starter chronology, not a complete history.')}<div class="notice" style="margin-bottom:18px">Formal colonial education was not the beginning of education in Nigerian societies. Indigenous knowledge systems, Islamic scholarship, apprenticeships and other traditions predate these milestones.</div><div class="card"><div class="timeline">${arr.map(x=>`<div class="event"><span class="year">${e(x.year)}</span><h3>${e(x.title)}</h3><p>${e(x.body)}</p>${source(x.url,'Explore the source ↗')}</div>`).join('')||'<div class="empty">No historical milestones match.</div>'}</div></div>`}
function watTime(iso){if(!iso)return 'No successful check yet';try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Lagos',dateStyle:'medium',timeStyle:'short',hour12:false}).format(new Date(iso))+' WAT'}catch(_){return iso}}
function currentStudy(){return A.tracks.flatMap(t=>t.lessons).find(x=>x.id===S.studyLesson)||A.tracks[0]?.lessons[0]}
function learning(){
 const total=A.tracks.reduce((n,t)=>n+t.lessons.length,0),finished=S.studyCompleted.length,percent=total?Math.round(100*finished/total):0;
 const track=A.tracks[S.track]||A.tracks[0],lesson=currentStudy();
 if(!track||!lesson)return '<div class="empty">Learning materials are unavailable. Check academy.js.</div>';
 const trackCompleted=t=>t.lessons.filter(x=>S.studyCompleted.includes(x.id)).length;
 const readings=(lesson.sources||[]).map(key=>A.sources.find(s=>s.id===key)).filter(Boolean);
 return `${heading('Systematic learning atlas','Understand Nigerian education from the ground up','Thirteen connected tracks, 65 source-guided lessons, learning checks and practical investigations. Begin with first principles; move through history, law, institutions, teaching, finance, technology and reform.')}<div class="card atlas-intro"><div class="row-between"><div><span class="eyebrow">YOUR STRUCTURED LEARNING JOURNEY</span><h3>${finished}/${total} lessons completed</h3></div>${badge(percent+'% complete')}</div><div class="progressbg"><div class="progressfill" style="width:${percent}%"></div></div><p>Use each lesson as a serious study note: read the explanation, examine Nigeria's application, follow the source, complete the investigation and check your reasoning. Progress and notes stay in this browser.</p></div><div class="track-scroller" aria-label="Choose a learning track">${A.tracks.map((t,i)=>`<button type="button" class="track-tab ${i===S.track?'active':''}" data-study-track="${i}"><span>${String(i+1).padStart(2,'0')} · ${e(t.title)}</span><small>${trackCompleted(t)}/${t.lessons.length} complete</small></button>`).join('')}</div><div class="study-grid"><aside class="study-sidebar"><div class="eyebrow">TRACK ${S.track+1} OF ${A.tracks.length}</div><h3>${e(track.title)}</h3><p>${e(track.purpose)}</p><div class="study-lesson-list">${track.lessons.map((l,i)=>`<button type="button" data-study-lesson="${attr(l.id)}" class="study-lesson ${S.studyLesson===l.id?'active':''}"><span class="study-num">${S.studyCompleted.includes(l.id)?'✓':String(i+1).padStart(2,'0')}</span><span>${e(l.title)}</span></button>`).join('')}</div><div class="side-aim"><b>Learning discipline</b><p>A completed lesson means you read and engaged with it; it does not certify mastery. Revisit lessons after consulting primary sources.</p></div></aside><article class="learning-article study-article"><div class="row-between"><div class="eyebrow">TRACK ${S.track+1} · LESSON ${lesson.number} · ${lesson.minutes} MIN STUDY</div>${badge(S.studyCompleted.includes(lesson.id)?'Completed':'In progress',S.studyCompleted.includes(lesson.id)?'':'gray')}</div><h2>${e(lesson.title)}</h2><div class="keytake"><b>01 — The idea</b><p>${e(lesson.foundation)}</p></div><h3>02 — How the system works</h3><p>${e(lesson.mechanism)}</p><h3>03 — Nigeria in practice</h3><p>${e(lesson.nigeria)}</p><h3>04 — Investigate and apply</h3><div class="question">${e(lesson.investigate)}</div><h3>05 — Check your understanding</h3><button class="btn light" data-study-answer="1">${S.showStudyAnswer?'Hide answer guide':'Reveal reasoning guide →'}</button>${S.showStudyAnswer?`<div class="answer-guide">${e(lesson.checkAnswer)}</div>`:''}<h3>Read the original source</h3><p>Source links are starting points. Verify the exact document, edition, publication date and relevant passage before quoting claims.</p><div class="study-sources">${readings.map(src=>source(src.url,src.title+' ↗')).join('')}</div><h3>Personal field notes</h3><textarea class="notes" id="studyNote" placeholder="In your own words: what did I learn, what remains uncertain, and which Nigerian institution should I examine?">${e(S.studyNotes[lesson.id]||'')}</textarea><div class="row-between study-bottom"><button class="btn" data-study-complete="${attr(lesson.id)}">${S.studyCompleted.includes(lesson.id)?'✓ Completed — undo':'Mark as studied ✓'}</button><button class="btn outline" data-study-next="1">Next lesson →</button></div></article></div><div class="notice warn" style="margin-top:18px"><strong>Scope:</strong> This is a comprehensive learning map and 65 substantial introductory study notes—not an exhaustive legal encyclopedia or automatically revised textbook. Documents and current officeholders require periodic source checks. Research the cited original documents for academic or policy use.</div>`
}
function glossary(){const arr=A.glossary.filter(g=>matches(g.term,g.definition));return `${heading('Definitions and concepts','Education system glossary','A searchable dictionary of major education, public-finance, teaching, data and evaluation terms. The meanings below are concise study definitions; follow linked lessons for the deeper mechanisms.')}<div class="notice" style="margin-bottom:16px">${A.glossary.length} foundational terms · Search using the box at the top of the page.</div><div class="grid two">${arr.map(g=>`<div class="card gloss-card"><h3>${e(g.term)}</h3><p>${e(g.definition)}</p></div>`).join('')||'<div class="empty">No matching definitions. Try another phrase.</div>'}</div>`}
function system(){return `${heading('Institutional systems map','Who controls what in Nigerian education?','A guided authority map. Always verify the exact mandate for the programme you are researching; institutions do not form one simple national command chain.')}<div class="card"><div class="eyebrow">THE FIVE QUESTIONS</div><div class="chain">${[['Rule','Who has lawful authority?'],['Money','Who appropriates and releases?'],['Delivery','Who actually implements?'],['Monitoring','Who inspects and measures?'],['Remedy','Who can fix a failure?']].map((x,i)=>`${i?'<span class="arrow">›</span>':''}<div class="node"><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div></div>${section('Levels of responsibility','','A conceptual guide—actual duties vary across education subsectors')}<div class="grid two">${[['Federal policy and coordination','FME and national bodies create policy, establish some standards, manage federal institutions and coordinate selected national programmes.','Policy and national strategy'],['Basic education implementation','State ministries, SUBEBs, local education authorities, school heads and teachers handle major aspects of classroom delivery.','Teacher deployment and facilities'],['Curriculum and assessment','NERDC, examination bodies and quality assurance systems interact, but curriculum authors do not personally teach every lesson.','Subject content and achievement'],['Tertiary and technical regulation','NUC, NBTE, NCCE and other bodies have distinct statutory or administrative roles, depending on institution and programme.','Accreditation and training standards'],['Education financing','Federal and state budgets, UBEC interventions, TETFund, student financing, donor programmes and households fund different things.','Approvals, releases and audits'],['Evidence and public oversight','School census systems, inspectors, independent researchers, civil society, parents and legislative bodies contribute distinct evidence and scrutiny.','Learning outcomes and accountability']].map(x=>`<div class="card"><div class="eyebrow">${x[2]}</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>${section('Follow a specific case')}<div class="card"><h3>Why is a primary school missing mathematics teachers?</h3><p>Start at the school and relevant state/local education authorities; verify teacher numbers, vacancies, budgeted posts and recruitment rules. Check whether federal or state programmes were involved. Ask the authority with the actual mandate for recruitment and deployment; track what it has done. Do not assume the Federal Minister appoints that school's teachers.</p><div style="margin-top:15px">${nav('power','Explore institutions and leaders →')}&nbsp;${nav('money','Follow spending evidence →','btn light')}</div></div>`}
function daily(){
 const B=S.daily||{};const state=B.feed_health||'awaiting deployment';const health=state==='healthy'?'Source check succeeded':state==='partial'?'Some sources failed':state==='unavailable'?'No source check succeeded':'Scheduled feeds not deployed';
 const checked=B.last_successful_check_utc;const recent=(B.recent_unreviewed_discoveries||[]).slice(0,8);
 return `${heading('7:00 AM West Africa Time','The daily education intelligence desk','Every morning: discover what agencies published, surface what needs verification, and learn how the development fits into Nigerian education policy and accountability.')}<div class="grid three"><div class="stat-card"><div class="top">Target update window</div><div class="num">07:00</div><div class="foot">Daily · Africa/Lagos · UTC+1</div></div><div class="stat-card"><div class="top">Last successful source check</div><div class="num" style="font-size:15px;line-height:1.5">${e(watTime(checked))}</div><div class="foot">Actual check timestamp, not article publication</div></div><div class="stat-card"><div class="top">Status</div><div class="num" style="font-size:16px">${e(health)}</div><div class="foot">${e(B.sources_succeeded?.length||0)} sources reached; ${e(B.sources_failed?.length||0)} failed</div></div></div><div class="notice ${state==='healthy'?'':'warn'}" style="margin-top:18px"><strong>Freshness disclosure:</strong> ${e(B.coverage_note||'No live source checks recorded yet.')} ${!checked?'This offline/downloadable version cannot run scheduled network requests on its own.':''} GitHub Actions scheduling is best-effort, not a guaranteed 7:00 AM service-level deadline.</div>${section('Latest automatically discovered items','', 'Unreviewed headlines: verify the original before drawing conclusions')}<div class="update-list">${recent.length?recent.map(u=>`<div class="update" style="grid-template-columns:54px minmax(0,1fr)"><div class="u-date"><b>${e(u.date.slice(8))}</b><small>${e(month(u.date))}</small></div><div>${badge('UNREVIEWED','gold')} <span class="tiny">${e(u.agency)} · ${e(u.topic)}</span><div class="u-title">${e(u.headline)}</div>${source(u.url,'Open original publication ↗')}</div></div>`).join(''):`<div class="empty">No recent discoveries in the published feed. This does <b>not</b> mean there was no education news nationally. Continue with sourced, curated items below.</div>`}</div>${section('Curated context','', 'Established source records, not automatically new today')}<div class="update-list">${D.updates.slice(0,4).map(updateRow).join('')}</div>${section('Agency connectivity and limitations')}<div class="grid two"><div class="card"><h3>Sources successfully reached</h3>${(B.sources_succeeded||[]).length?(B.sources_succeeded||[]).map(x=>`<p>${e(x.source)} · ${e(x.entries)} parsed records</p>`).join(''):'<p>Awaiting the first hosted scheduled check.</p>'}</div><div class="card"><h3>Sources that need attention</h3>${(B.sources_failed||[]).length?(B.sources_failed||[]).map(x=>`<p>${e(x.source)} · ${e(x.error)}</p>`).join(''):'<p>No failures reported in the latest completed check, or no check has run yet.</p>'}</div></div><div class="notice warn" style="margin-top:16px"><b>Daily insight ≠ comprehensive monitoring.</b> The provided pipeline currently polls a selected set of federal RSS feeds (FME, UBEC, NUC). It does not automatically cover every Nigerian state, institution, appointment, expenditure or policy outcome.</div>`
}

function sources(){let all=[...D.sources,...A.sources.map(s=>({name:s.title,type:'Academy research reference',url:s.url}))];let arr=[...new Map(all.map(x=>[x.url,x])).values()].filter(x=>matches(x.name,x.type,x.url));return `${heading('Research source room','Go to the original evidence','A directory of authoritative starting points. Trust depends on the exact claim: government statements establish what authorities announce, while spending documents and independent studies test what happened.')}<div class="grid two">${arr.map(x=>`<article class="card source-card"><div class="source-icon">↗</div><div style="flex:1"><h3>${e(x.name)}</h3><p>${e(x.type)}</p></div><div class="visit">${source(x.url,'Visit ↗')}</div></article>`).join('')||'<div class="empty">No sources match.</div>'}</div>${section('Evidence hierarchy')}<div class="grid three">${[['1 — Original documents','Acts, budgets, datasets, circulars, policy texts and audited reports.'],['2 — Implementation records','Procurement, delivery certificates, school census, monitoring reports and disbursements.'],['3 — Independent evaluation','Well-designed assessments, research studies, verification visits and credible comparisons.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><div class="notice warn" style="margin-top:19px">Official sources may verify that an announcement was made without verifying its impact. An unsourced social-media claim is not interchangeable with an audited or evaluated result.</div>`}
function action(){return `${heading('Civic research pathway','Turn interest into useful action','You do not need to hold public office to improve education. Begin with careful reading, a narrow question, ethical evidence collection and constructive follow-through.')}<div class="grid two"><div class="card"><h3>Your first 30 days</h3><div class="roadmap">${[['Week 1','Understand the system','Read the learning pathway, the 2004 UBE Act, and the responsibilities of UBEC and state boards.'],['Week 2','Pick one problem','Choose a narrow local question: literacy support, school facilities, teacher deployment, or grant delivery.'],['Week 3','Gather defensible evidence','Find official documents, statistics and stakeholder responsibilities. Record dates, limitations and what is unverified.'],['Week 4','Write a concise evidence brief','Present the problem, evidence, responsible agencies, possible remedies and next questions. Seek feedback and permission where required.']].map(x=>`<div class="roadmap-item"><span class="week">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</div></div><div class="card"><h3>My education reform notebook</h3><p style="margin-bottom:13px">Write a question, research direction, or evidence gap. This stays on your device; it is not sent to any government institution.</p><textarea class="notes" id="notes" placeholder="Example: Which agency reports primary-school classroom conditions in my local government, and what is the latest validated year?">${e(S.notes)}</textarea><div class="row-between" style="margin-top:13px"><span class="tiny" id="notesStatus">Locally saved when you type</span><button class="btn outline" data-export="1">Export notes ↗</button></div><div class="divider"></div><h3>My followed topics</h3><p style="margin-bottom:13px">Following is a local watchlist, not an email or push notification subscription.</p><div class="row-wrap">${['Foundational learning','Public finance','Curriculum','Teachers','Education data','Digital learning','Tertiary education'].map(x=>`<button class="switch ${S.following.includes(x)?'on':''}" data-follow="${attr(x)}">${S.following.includes(x)?'✓ ': '+ '}${e(x)}</button>`).join('')}</div></div></div><div class="callout" style="margin-top:19px"><b>Privacy and safety:</b> Do not collect pupils’ names, disability details, biometrics, examination results or photos without a lawful basis, necessary safeguards and proper authorization. Public accountability can normally begin with aggregated statistics and public records.</div>`}
function render(){const pages={overview,daily,updates,policies,power,system,money,history,learning,glossary,sources,action};shell((pages[S.route]||overview)());}
function go(route){if(!ROUTES.some(r=>r[0]===route))return;S.route=route;S.search='';location.hash=route;window.scrollTo(0,0);render();}
function drawerOpen(u){const d=document.getElementById('drawer');document.getElementById('drawerBody').innerHTML=`<button class="close" data-close="1" aria-label="Close">×</button><div class="eyebrow">Evidence record · ${e(u.agency)}</div><h2>${e(u.headline)}</h2><div class="row-wrap">${badge(u.topic)}${badge(u.status,u.status==='Unreviewed discovery'?'gold':'blue')}<span class="tiny">${datefmt(u.date)}</span></div><div class="d-label">What the source supports</div><p>${e(u.summary)}</p><div class="d-label">Next question to investigate</div><p>${e(u.impact||'Find original records and corroboration before treating this item as a verified fact.')}</p><div class="divider"></div><a class="btn" href="${attr(u.url)}" target="_blank" rel="noopener noreferrer">Open original source ↗</a><p class="tiny" style="margin-top:20px">This record does not assert any unverified implementation, expenditure or learning outcome.</p>`;d.classList.add('open');document.body.style.overflow='hidden';}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.body.style.overflow='';}
const app=document.getElementById('app');
app.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-route]');if(b){ev.preventDefault();go(b.dataset.route);return}
 const item=ev.target.closest('[data-update]');if(item){const u=updatesAll().find(x=>x.id===item.dataset.update);if(u)drawerOpen(u);return}
 const track=ev.target.closest('[data-study-track]');if(track){S.track=Number(track.dataset.studyTrack);S.studyLesson=A.tracks[S.track]?.lessons[0]?.id||S.studyLesson;S.showStudyAnswer=false;render();return}
  const lessonButton=ev.target.closest('[data-study-lesson]');if(lessonButton){S.studyLesson=lessonButton.dataset.studyLesson;S.showStudyAnswer=false;render();return}
  const studyAnswer=ev.target.closest('[data-study-answer]');if(studyAnswer){S.showStudyAnswer=!S.showStudyAnswer;render();return}
  const studyDone=ev.target.closest('[data-study-complete]');if(studyDone){const key=studyDone.dataset.studyComplete;S.studyCompleted=S.studyCompleted.includes(key)?S.studyCompleted.filter(k=>k!==key):[...S.studyCompleted,key];persist();render();return}
  const studyNext=ev.target.closest('[data-study-next]');if(studyNext){const all=A.tracks.flatMap(t=>t.lessons);let idx=all.findIndex(x=>x.id===S.studyLesson);const next=all[(idx+1)%all.length];S.studyLesson=next.id;S.track=A.tracks.findIndex(t=>t.lessons.some(x=>x.id===next.id));S.showStudyAnswer=false;render();return}
  const les=ev.target.closest('[data-lesson]');if(les){S.lesson=Number(les.dataset.lesson);render();return}
 const comp=ev.target.closest('[data-complete]');if(comp){let i=Number(comp.dataset.complete);S.completed=S.completed.includes(i)?S.completed.filter(x=>x!==i):[...S.completed,i];persist();render();return}
 const next=ev.target.closest('[data-nextlesson]');if(next){S.lesson=(S.lesson+1)%LESSONS.length;render();return}
 const follow=ev.target.closest('[data-follow]');if(follow){let k=follow.dataset.follow;S.following=S.following.includes(k)?S.following.filter(x=>x!==k):[...S.following,k];persist();render();return}
 const exp=ev.target.closest('[data-export]');if(exp){const content=`EDUATLAS NIGERIA — RESEARCH NOTES\nDate: ${new Date().toISOString().slice(0,10)}\n\n${S.notes}\n`;const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type:'text/plain'}));a.href=url;a.download='eduatlas-research-notes.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
});
app.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){const item=ev.target.closest('[data-update]');if(item){ev.preventDefault();item.click()}}});
app.addEventListener('input',ev=>{if(ev.target.id==='globalSearch'){S.search=ev.target.value;const pos=ev.target.selectionStart;render();const q=document.getElementById('globalSearch');q?.focus();q?.setSelectionRange(pos,pos)}else if(ev.target.id==='notes'){S.notes=ev.target.value;persist();const el=document.getElementById('notesStatus');if(el)el.textContent='✓ Saved locally'}else if(ev.target.id==='studyNote'){S.studyNotes[S.studyLesson]=ev.target.value;persist()}});
app.addEventListener('change',ev=>{if(ev.target.id==='topicFilter'){S.topic=ev.target.value;render()}if(ev.target.id==='actorFilter'){S.actor=ev.target.value;render()}if(ev.target.id==='fundSelect'){S.fund=ev.target.value;render()}});
document.addEventListener('click',ev=>{if(ev.target.closest('[data-close]'))closeDrawer()});document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeDrawer()});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(ROUTES.some(x=>x[0]===r)&&r!==S.route){S.route=r;S.search='';render()}});
render();
// Only hosted deployments can receive scheduled discovery files. An open tab polls
// for the latest published snapshots and surfaces failed checks instead of hiding them.
function refreshRemote(){
  fetch('data/auto_updates.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(items=>{
    if(!Array.isArray(items))return;
    const safe=items.filter(x=>x&&typeof x.url==='string'&&/^https:\/\//.test(x.url)&&typeof x.headline==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date));
    const before=S.auto.map(x=>x.id).join(',');
    S.auto=safe.map(x=>({...x,status:'Unreviewed discovery',impact:'Verify the original publisher, date, claims and separate implementation evidence before citing this item.'}));
    if(before!==S.auto.map(x=>x.id).join(',')&&['updates','overview'].includes(S.route))render();
  }).catch(()=>{});
  fetch('data/daily_brief.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(x=>{
    if(x&&typeof x==='object'&&x.edition==='daily-discovery-v2'){
      const changed=x.generated_utc!==S.daily?.generated_utc || x.feed_health!==S.daily?.feed_health;
      S.daily=x;if(changed&&S.route==='daily')render();
    }
  }).catch(()=>{});
}
if(location.protocol==='http:'||location.protocol==='https:'){
  refreshRemote();
  setInterval(refreshRemote,5*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshRemote()});
}
})();
</script></body></html>
