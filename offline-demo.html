},{"step":"Outputs delivered","value":null,"note":"Requires facility and classroom verification"},{"step":"Learning outcomes","value":null,"note":"Requires appropriate learning assessments"}],"url":"https://ubec.gov.ng/wp-content/uploads/2021/09/NGA87623-UBE-ACT-2004.pdf"}],"sources":[{"name":"Federal Ministry of Education","type":"Policy and official announcements","url":"https://education.gov.ng/"},{"name":"DNEMIS / Annual School Census","type":"Administrative education data","url":"https://emis.education.gov.ng/"},{"name":"Budget Office of the Federation","type":"Appropriations and spending reports","url":"https://budgetoffice.gov.ng/"},{"name":"Universal Basic Education Commission","type":"Basic-education programmes and grants","url":"https://ubec.gov.ng/"},{"name":"NERDC","type":"Curriculum and learning standards","url":"https://nerdc.gov.ng/"},{"name":"National Universities Commission","type":"University standards and policy","url":"https://www.nuc.edu.ng/"},{"name":"TETFund","type":"Tertiary intervention financing","url":"https://www.tetfund.gov.ng/"},{"name":"TRCN","type":"Teacher registration and standards","url":"https://www.trcn.gov.ng/"},{"name":"World Bank Nigeria education","type":"Financing and programme evaluation","url":"https://www.worldbank.org/en/country/nigeria"},{"name":"UNICEF Nigeria","type":"Children, education and learning evidence","url":"https://www.unicef.org/nigeria/education"},{"name":"Nigeria EdTech Strategy Hub","type":"Digital education policy","url":"https://edutech.education.gov.ng/"},{"name":"National Commission for Colleges of Education","type":"Teacher education and accreditation","url":"https://ncce.gov.ng/Home/ActsAndFunctions"},{"name":"National Board for Technical Education","type":"Technical education regulation and accreditation","url":"https://www.nbte.gov.ng/"},{"name":"National Examinations Council","type":"School examinations and certification","url":"https://neco.gov.ng/"},{"name":"Nigerian Education Loan Fund","type":"Tertiary student loans","url":"https://nelf.gov.ng/"},{"name":"World Bank Global Education Evidence Advisory Panel","type":"Impact evidence and cost-effectiveness","url":"https://www.worldbank.org/en/brief/2025/10/30/global-education-evidence-advisory-panel"}]};

window.EDUATLAS_ACADEMY={"title":"Systematic Learning Atlas","last_editorial_review":"2026-11-23","editorial_note":"Study content provides a structured introduction and investigative methods, not a substitute for official law, current instructions or supervised professional education. Verify revisions in cited primary sources.","tracks":[{"id":"t01","title":"Education: first principles","purpose":"Understand what education exists to do before judging whether institutions succeed.","lessons":[{"id":"t01-l01","number":1,"title":"What education is—and is not","foundation":"Education develops knowledge, judgement, values, capabilities and the ability to participate in society. Schooling is one organized pathway, but education also happens through families, apprenticeship, communities, workplaces and self-study. A school can operate without delivering high-quality education, so enrolment is a necessary but insufficient success measure.","mechanism":"Separate inputs (teachers, schools and money), activities (lessons), outputs (attendance and courses completed), outcomes (competence) and impacts (long-term opportunities). This causal chain prevents misleading claims about success.","nigeria":"In Nigeria, a new school building matters if it provides access, but further evidence is needed to know whether pupils actually develop literacy, numeracy and other competencies.","investigate":"Choose a Nigerian education headline and sort its claims into input, activity, output, outcome and impact.","checkAnswer":"A delivered classroom is an output. Better reading proficiency is an outcome. Higher lifetime earnings would be a possible longer-term impact.","sources":["policy"],"minutes":15},{"id":"t01-l02","number":2,"title":"Purposes of a national education system","foundation":"Education pursues several public purposes: individual development, economic capability, citizenship, cultural transmission, social mobility and scientific progress. These aims can reinforce or compete with each other. Defining success as examination passes alone excludes important purposes.","mechanism":"A balanced education system needs explicit goals for access, equity, learning, wellbeing, research and productive skills, with different measures for each. Curriculum choices reveal what a society prioritizes.","nigeria":"The National Policy on Education establishes broad national aspirations; studying it helps distinguish statutory and policy objectives from what schools can currently achieve.","investigate":"Draft six measurable outcomes for a good school without using enrolment alone.","checkAnswer":"Useful outcomes include reading progress, mathematical reasoning, retention, wellbeing, practical competence and responsible civic participation.","sources":["policy"],"minutes":15},{"id":"t01-l03","number":3,"title":"Access, participation, learning and attainment","foundation":"Access means an opportunity to enter education. Participation means regular engagement. Learning means demonstrated growth in knowledge or skill. Attainment refers to milestones such as grades or credentials. These terms describe related but different realities.","mechanism":"A learner may enrol, miss many days, pass by promotion and remain unable to read at grade level. Good monitoring checks each stage instead of treating a certificate as proof of competence.","nigeria":"In contexts affected by poverty, distance or insecurity, improved enrolment can coexist with weak attendance or learning.","investigate":"Create a four-column indicator sheet for enrolment, attendance, literacy and completion.","checkAnswer":"The four measures answer different questions; none should be inferred mechanically from another.","sources":["policy"],"minutes":15},{"id":"t01-l04","number":4,"title":"Equity, equality and inclusion","foundation":"Equality gives people the same entitlement or support. Equity addresses unequal barriers so people can achieve meaningful opportunities. Inclusion changes the environment to serve learners with diverse circumstances and abilities.","mechanism":"Funding per school may look equal while rural schools face higher costs, larger teacher shortages or accessibility needs. Equity-sensitive funding should use transparent, evidence-based need measures.","nigeria":"Different Nigerian states and communities have very different educational conditions. A single intervention can have very different effects across them.","investigate":"Explain why two schools with equal budgets might need different support.","checkAnswer":"Costs, distance, teacher shortages, disability accommodations and security vary by context; equal inputs may not produce equal opportunity.","sources":["policy"],"minutes":20},{"id":"t01-l05","number":5,"title":"Education as a connected system","foundation":"Education is not merely a collection of schools: family conditions, nutrition, teacher labour markets, public finance, regulations, assessment, employment and political decisions interact. A reform at one point can be blocked elsewhere.","mechanism":"Systems thinking traces feedback loops and bottlenecks. A new curriculum requires trained teachers, texts, class time, relevant examinations and monitoring; otherwise the written curriculum may never become classroom practice.","nigeria":"Use the curriculum–teacher–school–assessment relationship to explain why a federal policy can fail to change a local classroom.","investigate":"Draw a cause-and-effect diagram for poor reading skills, marking causes the education ministry cannot solve alone.","checkAnswer":"Teacher practices, attendance, home language, nutrition, materials and governance may jointly affect reading; a single-cause explanation is usually incomplete.","sources":["policy"],"minutes":20}]},{"id":"t02","title":"History of education in Nigeria","purpose":"Trace institutions from precolonial traditions through national reforms, without treating history as a list of dates.","lessons":[{"id":"t02-l01","number":1,"title":"Indigenous and Islamic knowledge traditions","foundation":"Before colonial schooling, diverse Nigerian communities transmitted skills and social knowledge through families, age groups, apprenticeship, religious learning and occupational guilds. Qur’anic educational traditions were established in parts of northern Nigeria long before British administration.","mechanism":"Education history should ask whose knowledge was recognized, who could access it, how it was assessed and which institutions transmitted it. Colonial formal schooling did not create education itself.","nigeria":"Craft apprenticeship, community farming knowledge, storytelling and Islamic schools illustrate different historic forms of organized learning.","investigate":"Compare one precolonial knowledge pathway with formal schooling across curriculum, teacher, evidence of competence and entry rules.","checkAnswer":"Both can be systematic; their purposes, knowledge forms and certification practices may differ.","sources":["policy"],"minutes":15},{"id":"t02-l02","number":2,"title":"Mission schools and colonial administration","foundation":"Christian mission schools expanded Western-style schooling in coastal and southern areas; colonial ordinances, grants and examinations shaped regulation and administration. Expansion was uneven across regions and communities.","mechanism":"Institutional path dependence matters: early investments and language policies can influence access, school networks and attitudes for generations. Avoid reducing complex historical change to one ordinance.","nigeria":"Look at missionary, colonial and regional policy traditions together when examining geographic differences in educational access.","investigate":"Explain why an 1882 ordinance is not the beginning of education in Nigeria.","checkAnswer":"It regulated certain colonial formal-school arrangements; earlier Indigenous and Islamic education existed.","sources":["policy"],"minutes":15},{"id":"t02-l03","number":3,"title":"Regional education and the 1955 Western Region initiative","foundation":"Before and around independence, regional governments made different choices about education access, finance and language. The Western Region introduced a major free-primary-education initiative in 1955, illustrating both political ambition and implementation challenges.","mechanism":"Rapid enrolment expansion creates demand for teachers, rooms, books and sustainable budgets. Studying historical reforms helps identify recurring tensions between access and quality.","nigeria":"Use the 1955 Western Region initiative as a case study in the costs of scaling public education rather than as a model to copy without context.","investigate":"What evidence would demonstrate that access expansion was matched by learning quality?","checkAnswer":"Look beyond enrolment to teacher preparation, classroom conditions, attendance and literacy outcomes.","sources":["policy"],"minutes":15},{"id":"t02-l04","number":4,"title":"National policy, UPE and the 6–3–3–4 era","foundation":"The 1969 national curriculum conference helped shape education-policy debate. The National Policy on Education appeared in 1977, and national Universal Primary Education was launched in 1976. Later changes in structure and governance affected federal–state responsibilities.","mechanism":"Policies often mix broad visions with detailed delivery obligations. Distinguish the date a system was announced from when its components were implemented across schools.","nigeria":"The 6–3–3–4 framework became influential in organizing primary, secondary and tertiary stages, even as implementation varied.","investigate":"Build a timeline explaining UPE, National Policy on Education and subsequent framework changes.","checkAnswer":"Policy publication, programme launch and full implementation are distinct historical events.","sources":["policy"],"minutes":20},{"id":"t02-l05","number":5,"title":"Universal Basic Education and contemporary renewal","foundation":"UBE was launched in 1999 and given a statutory framework in 2004. Subsequent decades saw reforms in curriculum, school finance, data systems, digital technology, skills programmes and education access.","mechanism":"Historical analysis identifies continuity and change: many 2026 programmes seek to address longstanding access, teaching, financing and accountability challenges.","nigeria":"Study the relationship between the UBE Act, UBEC, state boards, current NESRI pillars and programme financing.","investigate":"Identify one current reform that addresses a problem already visible in earlier education history.","checkAnswer":"Teacher capacity and the financing of universal access have repeatedly challenged reform efforts across decades.","sources":["policy"],"minutes":20}]},{"id":"t03","title":"Law, rights and policy","purpose":"Learn what is legally required, what is stated as policy and what must be verified in implementation.","lessons":[{"id":"t03-l01","number":1,"title":"Constitutional framework and education","foundation":"The Constitution includes education-related state policy objectives. Legal enforceability depends on the precise constitutional provisions, legislation and judicial interpretation; a national aspiration is not always an individually enforceable claim in the same way as a statutory entitlement.","mechanism":"Read primary legal texts before attributing obligations. Ask whether a rule is constitutional guidance, enacted law, regulation, policy or administrative announcement.","nigeria":"Many education discussions invoke section 18 of Nigeria’s Constitution; careful analysis also considers the Constitution’s broader framework and relevant legislation.","investigate":"Classify a ministry press release and an Act of the National Assembly as different types of authority.","checkAnswer":"An Act has legislative force; a press release primarily documents a communication, which may or may not implement a binding instrument.","sources":["ube"],"minutes":15},{"id":"t03-l02","number":2,"title":"UBE Act 2004 and compulsory basic education","foundation":"The Compulsory, Free Universal Basic Education Act provides a statutory basis for basic education obligations and UBEC’s role. Funding, eligibility and responsibilities operate through a legal and administrative structure involving federal and state authorities.","mechanism":"Always identify the relevant section of law and current implementing guidelines before asserting a specific entitlement or grant rule. National promises only improve access when states, local authorities and schools implement them.","nigeria":"The UBE framework is central to understanding JSS-level compulsory education and matching-grant discussions.","investigate":"Locate the statutory basis for free compulsory basic education; distinguish it from a general political statement.","checkAnswer":"The 2004 Act is the foundation; operational arrangements require reading current guidelines and implementation records.","sources":["ube"],"minutes":15},{"id":"t03-l03","number":3,"title":"National Policy on Education and other policy instruments","foundation":"A National Policy on Education expresses state intentions, goals, priorities and standards. Specialized policies address teachers, inclusive learning, skills, non-state schools and other domains. Policies can coexist with later announcements that require careful reconciliation.","mechanism":"For each policy, record edition, date, issuer, affected level, duties, enforcement route, financing assumptions and implementation evidence. An undated PDF or press report is not enough.","nigeria":"The FME hosts a National Policy on Education 2014 document and more recent policy materials; consult primary copies rather than assume one announcement replaced every provision.","investigate":"Create a policy register entry with issuer, effective date, source, target group and accountable implementer.","checkAnswer":"A useful register separates stated intent from evidence that frontline institutions complied.","sources":["ube"],"minutes":15},{"id":"t03-l04","number":4,"title":"Children, safeguarding and non-state provision","foundation":"Rights and protections affect school attendance, non-discrimination, safety, welfare and treatment of children. Public, private, faith-based and non-formal institutions operate under different arrangements and regulatory requirements.","mechanism":"Education law intersects with child protection, disability rights, public safety, employment, procurement and data protection. State-level legal differences can matter and should be verified.","nigeria":"The federal non-state schools policy provides a starting point for studying regulation of private and other non-government education providers.","investigate":"What safeguards should precede collection of pupils’ attendance or performance records?","checkAnswer":"Legal basis, data minimization, appropriate security, role-based access, parental/guardian rules where applicable and avoidance of unnecessary biometrics.","sources":["ube"],"minutes":20},{"id":"t03-l05","number":5,"title":"Legal accountability and how to read an instrument","foundation":"Legal analysis should ask who has authority to act, what conduct is required, what resources are provided, who may enforce the obligation and how disputes are resolved. It should also distinguish binding provisions from aspirational language.","mechanism":"A policy action may require a budget line, regulation, state approval or operational guidelines before school-level implementation. Track each link in the chain.","nigeria":"When a new curriculum is announced, inspect the approved framework, rollout circulars, examination rules and state-level directives.","investigate":"Build a 6-row evidence checklist for any announced nationwide reform.","checkAnswer":"Include official instrument, date, covered schools, funding, teacher guidance, implementation reporting and independent results.","sources":["ube"],"minutes":20}]},{"id":"t04","title":"Stakeholders and institutional power","purpose":"Learn who decides, pays, implements, regulates and measures outcomes across levels.","lessons":[{"id":"t04-l01","number":1,"title":"Federal Ministry of Education and federal coordination","foundation":"The Federal Ministry of Education has major responsibilities for federal education policy, coordination and oversight. Federal influence does not mean the ministry directly operates every state primary school.","mechanism":"Mapping authority means distinguishing policy formation, regulation, funding and local delivery. The actor making an announcement may differ from the one who must recruit teachers or procure school materials.","nigeria":"Use official FME pages and current appointment records; named officeholders can change, so review dates matter.","investigate":"For a school infrastructure gap, identify federal, state and school roles separately.","checkAnswer":"Find the responsible state or school authority, then trace whether federal intervention grants or other funding are involved.","sources":["fme"],"minutes":15},{"id":"t04-l02","number":2,"title":"UBEC, SUBEB and local basic education","foundation":"UBEC coordinates federal universal basic education interventions, while State Universal Basic Education Boards and local education bodies are central to implementation. The detailed split of responsibilities depends on law and administrative arrangements.","mechanism":"Trace decisions from a national programme to state eligibility, transfers, procurement, contractors, delivery and school-level use. The local government area is an important geographical unit but is not itself proof of who controls each budget line.","nigeria":"For an unused classroom block, identify the project owner, contractor, SUBEB records and school management rather than attributing responsibility by guesswork.","investigate":"Draw a responsibility chain for a textbook programme from federal announcement to pupil access.","checkAnswer":"The chain may run through UBEC/NERDC, state authorities, procurement, school delivery and teacher use; document the actual programme-specific chain.","sources":["fme"],"minutes":15},{"id":"t04-l03","number":3,"title":"Curriculum, examinations and quality assurance bodies","foundation":"NERDC contributes curriculum research and development. Examination and certification agencies, such as WAEC and NECO, have particular assessment roles; quality assurance requires appropriate supervision and standards.","mechanism":"Curriculum is an intended learning programme, while examination syllabuses and classroom delivery influence what is actually taught. Students can face conflicting incentives if these are not aligned.","nigeria":"When subjects change, ask whether the curriculum, textbooks, teacher training and examination specifications changed together.","investigate":"Which agency source would you consult first to verify a change in the Basic Education Curriculum?","checkAnswer":"NERDC materials and official FME announcements, followed by verified examination-body guidance.","sources":["fme"],"minutes":15},{"id":"t04-l04","number":4,"title":"NUC, NBTE, NCCE, TRCN and TETFund","foundation":"The National Universities Commission, National Board for Technical Education, National Commission for Colleges of Education, Teachers Registration Council of Nigeria and TETFund have different oversight, regulation, professional or funding mandates.","mechanism":"A regulator sets or monitors standards; an institution provides education; a financing agency supports eligible projects. Confusing them makes it difficult to ask the right accountability question.","nigeria":"A university accreditation issue should not be addressed as though it were a SUBEB primary-school grant issue.","investigate":"Match tertiary accreditation, technical standards, teacher registration and research grant questions to their institutions.","checkAnswer":"NUC, NBTE, TRCN and TETFund respectively are relevant, though precise procedures must be checked.","sources":["fme"],"minutes":20},{"id":"t04-l05","number":5,"title":"States, civil society, families and employers","foundation":"State ministries and education boards are primary decision-makers for much school delivery. Parents, community associations, private operators, unions, nonprofits and employers influence access, teaching, safety and workforce preparation.","mechanism":"Stakeholder analysis distinguishes decision power, financial resources, implementation responsibility and influence. It helps build coalitions without confusing advocacy with legal authority.","nigeria":"A local reading intervention may depend on the school head, district supervisors, parents, a state board and a nonprofit implementer.","investigate":"Create a power–interest map for one local education problem.","checkAnswer":"Prioritize those with decision power and those affected; involve teachers and families early, not only senior officials.","sources":["fme"],"minutes":20}]},{"id":"t05","title":"Educational levels and learning pathways","purpose":"Understand what learners should acquire at every stage and how transitions work.","lessons":[{"id":"t05-l01","number":1,"title":"Early childhood care and pre-primary education","foundation":"Early childhood education builds language, social interaction, self-regulation, motor development and curiosity, often through play and guided activity. It is not merely an early version of secondary-school examination preparation.","mechanism":"School readiness depends on health, nutrition, secure relationships, opportunities to talk and appropriate learning materials. Quality must be defined developmentally rather than by worksheets alone.","nigeria":"Study ECCDE responsibilities and the practical barriers to affordable early learning in your state.","investigate":"Design an age-appropriate observation of language development without formal testing pressure.","checkAnswer":"Storytelling, conversation, play, listening and observation can reveal useful developmental information.","sources":["policy"],"minutes":15},{"id":"t05-l02","number":2,"title":"Primary education and foundational competence","foundation":"Primary schooling establishes literacy, numeracy, communication and the basis for disciplinary understanding. Progress should be cumulative, but promotion alone cannot demonstrate mastery.","mechanism":"Early reading includes decoding, fluency, vocabulary and comprehension; mathematics includes number sense and operations. Targeted support matters when these foundations are missing.","nigeria":"Explore Nigeria’s foundational learning evidence and a state-level basic-school data source.","investigate":"If a Primary 4 child cannot read a short passage, what should the school do first?","checkAnswer":"Diagnose specific gaps, provide structured support and monitor progress rather than assume more grade-level textbook pages solve the problem.","sources":["policy"],"minutes":15},{"id":"t05-l03","number":3,"title":"Junior secondary: consolidating and exploring","foundation":"Junior secondary links basic schooling to further academic, technical or other pathways. Students need growing subject knowledge, reasoning, language skills and exposure to interests and occupations.","mechanism":"Subject specialization increases, so weak foundational skills become more consequential. Effective transition requires guidance, assessment and support for learners at risk of dropout.","nigeria":"Understand JSS within the nine-year basic education policy context and investigate transitions to senior secondary.","investigate":"List three warning signals for a learner at risk of not completing JSS.","checkAnswer":"Chronic absence, declining performance, financial hardship or safety concerns can indicate risk; investigate respectfully.","sources":["policy"],"minutes":15},{"id":"t05-l04","number":4,"title":"Senior secondary, examinations and choices","foundation":"Senior secondary study deepens disciplinary learning and prepares students for higher education, training and work. Examination results matter but should not be mistaken for a complete measure of competence.","mechanism":"Good guidance helps students choose academic or technical pathways with accurate information about entry requirements and practical demands.","nigeria":"Investigate the relationship among curricula, WAEC/NECO certification and tertiary admissions.","investigate":"How would you assess science competence beyond examination scores?","checkAnswer":"Include correctly supervised laboratory skills, explanation, data interpretation and safe practices.","sources":["policy"],"minutes":20},{"id":"t05-l05","number":5,"title":"TVET, adult education and lifelong learning","foundation":"Technical and vocational education, apprenticeships, continuing education and non-formal programmes broaden education beyond linear university pathways. Competency certification should reflect what a learner can actually do.","mechanism":"Effective technical training requires equipment, skilled instructors, relevant employers and credible practical assessment. Job creation also depends on the wider economy.","nigeria":"Read the national skills policy and compare trade-centre outcomes with labour-market opportunities in a chosen state.","investigate":"Choose a trade and identify the evidence needed to claim trainees are work-ready.","checkAnswer":"Independent practical demonstration, safety competence and employer feedback are stronger than certificates issued solely for attendance.","sources":["policy"],"minutes":20}]},{"id":"t06","title":"Curriculum, pedagogy and language","purpose":"Explore how knowledge moves from official plans into meaningful student learning.","lessons":[{"id":"t06-l01","number":1,"title":"Curriculum design from first principles","foundation":"A curriculum specifies desired competencies, knowledge sequences, content, methods and expectations across grades. A syllabus lists topics; a lesson plan translates objectives into teaching. These are related but distinct documents.","mechanism":"Curriculum alignment checks whether textbooks, lesson time, teacher preparation and assessments support the intended competencies. Subject reduction by itself cannot prove that learning has improved.","nigeria":"Use an official NERDC curriculum to identify one learning objective, prerequisite concepts and assessment method.","investigate":"Choose one objective and write an observable demonstration of achievement.","checkAnswer":"A good demonstration specifies what the learner can explain, do or produce under fair conditions.","sources":["curriculum"],"minutes":15},{"id":"t06-l02","number":2,"title":"Reading instruction and language comprehension","foundation":"Reading combines recognizing written words with understanding language. Phonemic awareness, phonics, fluency, vocabulary and comprehension matter in different proportions as learners progress.","mechanism":"Assessment should identify whether a child struggles to decode words, understand vocabulary or interpret a text; each requires different instructional support.","nigeria":"Compare reading lessons in a familiar Nigerian language and English, distinguishing language proficiency from reading processes.","investigate":"What is wrong with giving every struggling reader the same worksheet?","checkAnswer":"Children have different decoding, fluency, language and comprehension needs; diagnostic teaching targets the actual gap.","sources":["curriculum"],"minutes":15},{"id":"t06-l03","number":3,"title":"Teaching mathematics as reasoning","foundation":"Mathematics learning builds from number sense and operations to fractions, algebra, measurement, geometry and data interpretation. Fluency and conceptual understanding reinforce each other; neither is sufficient alone.","mechanism":"Worked examples, deliberate practice, manipulatives and timely feedback help students connect concepts with procedures. Applications must be mathematically correct and suitable for the learner’s level.","nigeria":"Use local pricing, measurement or school attendance data to design a problem that requires explanation rather than answer copying.","investigate":"Create a fraction lesson with an example, guided practice and an independent check.","checkAnswer":"The independent check should show whether pupils can reason without merely repeating the teacher’s demonstration.","sources":["curriculum"],"minutes":15},{"id":"t06-l04","number":4,"title":"Active learning, explicit instruction and feedback","foundation":"Effective pedagogy is not a choice between silent memorization and unguided discovery. Teachers often need to explain clearly, model thinking, ask questions, structure practice and then encourage increasingly independent application.","mechanism":"Feedback should tell learners what they did, where the misconception lies and how to improve. Observation can reveal problems that examination results alone do not show.","nigeria":"In a crowded Nigerian classroom, short checks for understanding can help a teacher discover who needs additional support.","investigate":"Write three questions that distinguish factual recall, explanation and application.","checkAnswer":"A progression might ask for a definition, a reason why it works and a new problem solved using the concept.","sources":["curriculum"],"minutes":20},{"id":"t06-l05","number":5,"title":"Language policy and inclusive classroom practice","foundation":"Language of instruction affects comprehension, belonging and access to subject knowledge. Multilingual contexts require attention to the languages learners actually understand, teacher competence and transition to wider languages of communication.","mechanism":"Policy debates about English and mother-tongue approaches should be tested against local evidence rather than treated as automatic solutions. Inclusive practice also considers disability, gender and learners who have missed schooling.","nigeria":"Review the current policy and a sample lesson: who would not be able to follow it without support?","investigate":"Design one concept explanation with local-language scaffolding and a clear route to English academic vocabulary.","checkAnswer":"Check meaning in a familiar language, teach needed English terms explicitly, and assess understanding rather than accent or fluency alone.","sources":["curriculum"],"minutes":20}]},{"id":"t07","title":"Assessment, data and evidence","purpose":"Learn how to decide what students know and what statistics can—and cannot—establish.","lessons":[{"id":"t07-l01","number":1,"title":"Assessment is a measurement problem","foundation":"Assessments infer a learner’s ability from performance on selected tasks. Reliability concerns consistency; validity concerns whether evidence supports the interpretation being made. A high score is not automatically valid evidence of every kind of competence.","mechanism":"A reading test must use appropriate text and language. A practical engineering skill cannot be established by only asking for a memorized definition.","nigeria":"When a school reports pass rates, ask which exam, cohort, eligibility rules and scoring standards were used.","investigate":"Give an example of a test score that is reliable but misleading.","checkAnswer":"A consistently administered recall quiz may measure memorized facts reliably but not practical problem-solving competence.","sources":["unicef"],"minutes":15},{"id":"t07-l02","number":2,"title":"Formative and summative assessment","foundation":"Formative assessment guides teaching while learning is happening; summative assessment summarizes performance after a period of instruction. Both can be useful if they are well designed and ethically used.","mechanism":"Quick classroom checks can show misconceptions immediately. Major examinations are more useful for certification or system summaries, but may be too late to repair early learning gaps.","nigeria":"Explore how termly diagnostic reading assessments could complement national examinations.","investigate":"Design a five-minute check for understanding after a numeracy lesson.","checkAnswer":"Ask learners to solve a novel item, explain one step and use the result to group targeted follow-up instruction.","sources":["unicef"],"minutes":15},{"id":"t07-l03","number":3,"title":"Learning poverty and foundational learning statistics","foundation":"A learning indicator always needs an age or grade, a proficiency threshold, a population, a reference year and a method. Learning poverty and grade-level minimum proficiency are not interchangeable indicators.","mechanism":"Cross-country or cross-state comparisons can mislead if the test, sampled learners, language and reference year differ. Improvement claims require comparable measures over time.","nigeria":"Read UNICEF’s foundational learning analysis and record exactly which cohorts and years each number describes.","investigate":"What would you need before claiming that literacy increased between 2022 and 2026?","checkAnswer":"Comparable instruments or robust linking, comparable samples, uncertainty ranges, dates and clear definitions.","sources":["unicef"],"minutes":15},{"id":"t07-l04","number":4,"title":"School census, denominators and missing data","foundation":"A school census can describe institutions, pupils, staff and facilities, but completeness and validation determine whether totals are trustworthy. Schools that fail to report may differ systematically from reporting schools.","mechanism":"A dashboard showing 55% of schools reporting is not a complete picture of the nation. Report missingness, definitions, updates and geographic coverage alongside every statistic.","nigeria":"Inspect the national education data portal and compare the reported coverage with a full census aspiration.","investigate":"Calculate a reporting rate from schools responding and the schools expected to respond.","checkAnswer":"Reporting rate equals responding schools divided by expected schools, with a clearly defined school frame.","sources":["unicef"],"minutes":20},{"id":"t07-l05","number":5,"title":"Evaluation: attribution, causality and cost","foundation":"A programme’s success is not established simply because outcomes improved after it started. Other changes could explain the improvement. Evaluation designs compare credible counterfactuals where possible and describe limitations.","mechanism":"Randomized, quasi-experimental and careful mixed-method evaluations have different strengths. Cost-effectiveness asks how much additional outcome is produced per unit of spending, not just whether a project is inexpensive.","nigeria":"Assess a reading programme that reports increased scores without a comparison group; consider alternative explanations.","investigate":"Which evidence would most strengthen a claim that teacher coaching caused improvement?","checkAnswer":"A credible comparison, baseline data, sufficient sample, well-measured outcomes and transparent implementation details.","sources":["unicef"],"minutes":20}]},{"id":"t08","title":"Teachers and school leadership","purpose":"Understand the human systems behind good instruction and institutional performance.","lessons":[{"id":"t08-l01","number":1,"title":"Teacher preparation and professional standards","foundation":"Teacher quality depends on initial preparation, subject knowledge, pedagogical skill, mentoring and appropriate professional norms. Qualifications and licensing provide signals, but do not fully describe actual classroom practice.","mechanism":"Preparation should connect theory with observed teaching, practice, feedback and evidence of student learning. Continuing professional development should be job-embedded rather than only ceremonial workshops.","nigeria":"Study the National Teachers Policy and identify which institutions are responsible for teacher preparation, registration and deployment.","investigate":"Describe an effective training sequence after a new mathematics curriculum is announced.","checkAnswer":"Content study, demonstration, guided practice, classroom coaching, observation and iterative feedback.","sources":["teacher"],"minutes":15},{"id":"t08-l02","number":2,"title":"Teacher deployment and staffing","foundation":"A state may have many teachers overall while rural schools face shortages in specific grades or subjects. Staffing needs reliable school locations, enrolment, subject requirements, teacher qualifications and deployment rules.","mechanism":"Pupil–teacher ratios are useful but can hide multi-grade teaching, subject shortages, absenteeism and inequitable allocation. Staffing reform also needs incentives, welfare and transparent transfer processes.","nigeria":"Compare two hypothetical local government areas with different pupil–teacher ratios and school distances.","investigate":"What information should a teacher workforce dashboard show beyond headcount?","checkAnswer":"Qualification, subject, grade taught, location, attendance, vacancy, class size and rural/hardship conditions.","sources":["teacher"],"minutes":15},{"id":"t08-l03","number":3,"title":"Instructional coaching and school-based support","foundation":"Professional learning works best when connected to the teacher’s actual lesson challenges. Coaching involves observing, modelling, rehearsing and giving specific, non-punitive feedback.","mechanism":"Head teachers and supervisors can schedule small, repeatable improvements: improve questioning this week, assess misconceptions next week, and inspect pupil work afterwards.","nigeria":"Evaluate an intervention providing tablets but no teacher coaching; what instructional mechanism is missing?","investigate":"Draft a four-week coaching cycle for a primary reading teacher.","checkAnswer":"Baseline observation, one teaching goal, practice and feedback, re-observation and evidence of pupil change.","sources":["teacher"],"minutes":15},{"id":"t08-l04","number":4,"title":"Head teachers, governance and school improvement","foundation":"A school leader balances administration, safety, instructional quality, staff support, family relationships and responsible resource management. Leadership requires trustworthy information and clear authority.","mechanism":"A school improvement plan specifies a narrow problem, measurable target, responsibilities, resources and follow-up dates. Quality assurance should support improvement rather than reward attractive paperwork.","nigeria":"Build a school improvement plan for weak Primary 3 reading with a termly review.","investigate":"What should a head teacher inspect beyond examination pass rates?","checkAnswer":"Attendance, sample pupil work, teacher support needs, safe facilities, progress assessments and learning conditions.","sources":["teacher"],"minutes":20},{"id":"t08-l05","number":5,"title":"Teacher motivation, accountability and ethics","foundation":"Teachers need fair pay, reasonable workload, safety and professional respect. Accountability matters too, but punitive measurement without support can encourage manipulation and attrition.","mechanism":"Use balanced teacher development systems combining support, transparent evaluation, grievance mechanisms and professional ethics. Pupil results are affected by context and should not be used as the only measure of teacher worth.","nigeria":"Investigate how delayed salary or excessive class size could reduce teaching effectiveness even with trained staff.","investigate":"Design a teacher performance framework that minimizes perverse incentives.","checkAnswer":"Use classroom observation, professional development, attendance, context-adjusted learner progress and due process.","sources":["teacher"],"minutes":20}]},{"id":"t09","title":"Education finance, procurement and accountability","purpose":"Trace every naira from a political commitment toward functioning services and student learning.","lessons":[{"id":"t09-l01","number":1,"title":"Budget cycles and the public-finance chain","foundation":"Appropriation is authorization to spend, not proof that cash was available. Releases or disbursements, expenditure, delivered outputs and learning outcomes are subsequent and distinct evidence stages.","mechanism":"Governments also make commitments, incur obligations and pay invoices at different times. Education finance spans federal, state, local, donor and household expenditure; never combine numbers without matching scopes.","nigeria":"Take an education budget headline and identify the fiscal year, level of government, vote or ministry, and whether it describes a proposal, enacted budget or expenditure.","investigate":"What is wrong with saying a ₦10 billion allocation means ₦10 billion reached classrooms?","checkAnswer":"Budget approval establishes an intention or legal authorization; the release, spending, procurement and classroom-use stages still need evidence.","sources":["finance"],"minutes":15},{"id":"t09-l02","number":2,"title":"Federal, state and donor financing","foundation":"Nigeria’s education expenditure is distributed across government levels. Intervention funds, state recurrent budgets, personnel costs and externally financed programmes may follow different release and reporting systems.","mechanism":"Avoid treating a World Bank project approval as though it were an executed federal appropriation. Record programme currency, counterpart conditions, dates, implementing agencies and verified disbursements separately.","nigeria":"Compare a state SUBEB grant with a donor-supported basic-learning programme; identify the different accountability documents.","investigate":"Create a funding-source map for one school improvement project.","checkAnswer":"List federal, state, donor and school/community streams separately, with verifiable documents and no double counting.","sources":["finance"],"minutes":15},{"id":"t09-l03","number":3,"title":"Procurement, contractors and verified delivery","foundation":"Procurement translates funding into contracts for buildings, textbooks, equipment and services. A signed contract is not equivalent to a completed or functional output.","mechanism":"Track tender, award, contractor, cost, implementation milestones, inspection, payments and maintenance responsibilities. Evidence quality improves when public documents, site inspection and independent checks agree.","nigeria":"Investigate a school-laboratory project from budget line to equipment that pupils can actually use.","investigate":"Name four records useful for checking a claimed classroom renovation.","checkAnswer":"Budget line, tender/award, payment or completion record, and dated site verification with safeguards.","sources":["finance"],"minutes":15},{"id":"t09-l04","number":4,"title":"Public audit, transparency and citizen scrutiny","foundation":"Public financial management uses internal controls, audits, legislative oversight, procurement rules and reporting. Citizen oversight works best when claims are narrow and supported by public records.","mechanism":"Different reports answer different questions: budget reports track execution, audits examine records and compliance, and learning assessments examine education results. No single document answers all three.","nigeria":"Explore the Budget Office quarterly implementation report and formulate a request for a missing school programme record.","investigate":"How should a researcher label a spending amount that cannot be independently verified?","checkAnswer":"Explicitly unknown or unverified, with the source checked and next required evidence noted.","sources":["finance"],"minutes":20},{"id":"t09-l05","number":5,"title":"Cost-effectiveness and opportunity cost","foundation":"A programme can be successful but too costly to reach everyone. Opportunity cost asks what alternative educational benefit could have been obtained with the same resources.","mechanism":"Compare costs against meaningful learning improvements, sustainability and equity rather than only computers distributed or participants trained. Specify all material costs, including training and maintenance.","nigeria":"Imagine choosing between teacher coaching, offline tablets and classroom repair in a high-need school: do not decide before assessing bottlenecks.","investigate":"Design a comparison table with cost, reach, evidence of impact, maintenance and equity.","checkAnswer":"The preferred intervention depends on local needs, credible impact evidence and total lifecycle costs.","sources":["finance"],"minutes":20}]},{"id":"t10","title":"Access, inclusion, wellbeing and safety","purpose":"Examine why children miss learning and how systems can remove different barriers.","lessons":[{"id":"t10-l01","number":1,"title":"Out-of-school children and pathways back","foundation":"Children may never enrol, enter late, drop out, or attend irregularly. Measures vary by age definition and sampling year; a single headline number cannot describe every excluded child.","mechanism":"Effective outreach identifies local barriers such as distance, fees, insecurity, disability accommodations or family livelihood needs. Accelerated education can help over-age learners re-enter suitable pathways.","nigeria":"Compare approaches for an out-of-school child in a conflict-affected community and a child excluded by costs in an urban setting.","investigate":"Why might a free school still be inaccessible?","checkAnswer":"Transport, uniforms, learning materials, safety, opportunity costs and disability support may remain barriers.","sources":["safety"],"minutes":15},{"id":"t10-l02","number":2,"title":"Gender, disability and layered disadvantage","foundation":"Barriers interact: poverty, geography, gender, disability and displacement can compound exclusion. Universal rules do not always deliver equal access.","mechanism":"Data should be disaggregated where lawful, ethical and statistically safe. Disability-inclusive schooling includes accessible buildings, teacher support, appropriate materials and respectful accommodation.","nigeria":"Study differences between states and local communities without assuming any state’s learners are uniform.","investigate":"Design an inclusion audit for school buildings and classroom participation.","checkAnswer":"Assess routes, toilets, materials, assistive needs, communication, teacher practice and learner dignity.","sources":["safety"],"minutes":15},{"id":"t10-l03","number":3,"title":"Schools, health, nutrition and learning","foundation":"Learning depends partly on wellbeing, nutrition, sleep, sanitation and safe environments. Education agencies cannot solve all these problems alone, making coordination with health and social protection important.","mechanism":"School feeding, clean water, safe toilets, referrals and preventive health can improve participation or wellbeing, but their effects should be evaluated in the actual setting.","nigeria":"A child with repeated illness may be absent despite strong teaching. Identify responsible education and health actors.","investigate":"Develop a joint school–health indicator list without collecting unnecessary sensitive information.","checkAnswer":"Aggregate absence, functional WASH, school meal reach where applicable, and referral processes; protect personal records.","sources":["safety"],"minutes":15},{"id":"t10-l04","number":4,"title":"Conflict, abductions and safe learning","foundation":"Education safety includes prevention, emergency preparedness, accessible reporting, child safeguarding and plans for continuity during disruptions. Security risks vary substantially by geography.","mechanism":"A safe-schools policy needs defined incident reporting, responsible personnel, training, response pathways and recovery. Avoid publishing sensitive security details that could endanger schools or children.","nigeria":"Review the federal basic-education school safety materials and assess which parts require state or local execution.","investigate":"What can a public safety dashboard disclose without exposing pupils or security arrangements?","checkAnswer":"Aggregated risk-assessment completion, incident-response readiness and interruption days, with careful disclosure controls.","sources":["safety"],"minutes":20},{"id":"t10-l05","number":5,"title":"Families, community trust and retention","foundation":"Parents and caregivers influence attendance, language development, wellbeing and educational choices. Community trust is crucial when a programme changes teaching language, school hours or attendance rules.","mechanism":"Constructive engagement listens to constraints, tests solutions and provides channels for complaints. Avoid blaming families for barriers rooted in poverty or public-service failure.","nigeria":"Plan a community meeting about a local school’s chronic absence without revealing the names of absent pupils.","investigate":"Write three nonjudgmental questions to ask caregivers about school attendance.","checkAnswer":"Ask about transport, costs, safety, learning experience and solutions the community considers feasible.","sources":["safety"],"minutes":20}]},{"id":"t11","title":"Higher education, TVET and national capability","purpose":"Study how tertiary institutions produce professionals, research and technology—not just certificates.","lessons":[{"id":"t11-l01","number":1,"title":"Universities, polytechnics and colleges of education","foundation":"Universities, polytechnics and colleges of education pursue different mandates and qualifications, though their activities may overlap. Their regulators, funding sources and accreditation arrangements differ.","mechanism":"Quality should consider academic standards, student support, infrastructure, practical work and graduate capability. Avoid treating institutional labels as automatic proof of effectiveness.","nigeria":"Map the roles of NUC, NBTE and NCCE, then identify the current standards for one programme you know.","investigate":"Who would you consult about approval of a polytechnic technical programme?","checkAnswer":"NBTE and the relevant institution, while checking the exact programme and regulatory framework.","sources":["nuc"],"minutes":15},{"id":"t11-l02","number":2,"title":"Accreditation, teaching quality and infrastructure","foundation":"Accreditation checks whether programmes meet defined conditions, but it does not prove every graduate has mastered a professional skill. Labs, libraries, staff expertise, safety and workload influence education quality.","mechanism":"Programme evaluation should inspect inputs, teaching processes, student work, completion, practical competency and external review. Continuous improvement matters between accreditation cycles.","nigeria":"For biomedical engineering, compare an inventory of devices with evidence students can operate them competently and safely.","investigate":"Design an independent practical competency demonstration for one laboratory outcome.","checkAnswer":"Use a validated task, clear safety and performance rubric, observed execution and reproducible evidence.","sources":["nuc"],"minutes":15},{"id":"t11-l03","number":3,"title":"Research ecosystems and knowledge production","foundation":"Universities should both teach existing knowledge and create new knowledge. Basic research, applied research, reproducibility, peer review, research ethics and open science all matter.","mechanism":"Research funding requires transparent criteria, responsible grants management, equipment maintenance and pathways for findings to improve practice. Publication counts alone can distort incentives.","nigeria":"Explore TETFund, institutional laboratories and partnerships addressing Nigerian agriculture, health, education or energy problems.","investigate":"What evidence shows that a research grant contributed useful knowledge?","checkAnswer":"Quality of methods, reproducibility, credible outputs, capacity built and documented use or follow-up.","sources":["nuc"],"minutes":15},{"id":"t11-l04","number":4,"title":"Student financing and institutional sustainability","foundation":"Tertiary systems are supported by combinations of public funding, institution resources, household payments, loans and grants. Financial access affects enrolment, persistence and graduation.","mechanism":"Student loans require accurate eligibility, disbursement, communication and repayment policies. Track applications, approved beneficiaries, funds disbursed and sustained educational benefit as separate stages.","nigeria":"A national student loan scheme may support access but does not automatically guarantee adequate university funding or employment after graduation.","investigate":"Separate three measures: approved loans, actual payments and students remaining enrolled.","checkAnswer":"They respectively describe commitments, disbursement outputs and a possible education outcome.","sources":["nuc"],"minutes":20},{"id":"t11-l05","number":5,"title":"Graduate transitions, apprenticeships and the economy","foundation":"Employment depends on both graduate skills and demand for labour. Universities, technical institutions and employers can improve transition through projects, placements and reliable career information.","mechanism":"Measure skills, graduate destinations, time to employment, earnings where lawful, and job quality while accounting for economic conditions and non-response bias.","nigeria":"A high unemployment rate among graduates cannot alone establish that teachers failed; investigate industry demand and the wider economy.","investigate":"Design a graduate tracer study that avoids overclaiming causation.","checkAnswer":"Record cohort, response rate, course, location, type of job, time since graduation and limitations.","sources":["nuc"],"minutes":20}]},{"id":"t12","title":"Education technology, data and AI","purpose":"Learn when digital systems genuinely improve learning and when they simply produce dashboards.","lessons":[{"id":"t12-l01","number":1,"title":"EdTech as a means, not an end","foundation":"A device, app or internet connection is an input. The educational outcome depends on content quality, teacher support, access, learner use, maintenance and inclusion.","mechanism":"A credible technology intervention starts with a learning problem. It then compares digital and non-digital options, their costs, infrastructure requirements and evidence of impact.","nigeria":"A school without electricity may benefit from infrastructure and teacher materials before an always-online tutoring platform.","investigate":"State a learning goal and explain how you would test whether a tablet app outperforms an alternative.","checkAnswer":"Use comparable groups or another credible design, objective learning measures, full costs and safeguarding checks.","sources":["edtech"],"minutes":15},{"id":"t12-l02","number":2,"title":"EMIS, national school data and interoperability","foundation":"Education management information systems describe schools, teachers, learners, facilities and sometimes assessments. Data interoperability allows authorized systems to exchange consistent records using agreed definitions.","mechanism":"Unique identifiers, data dictionaries, validation, update schedules and audit trails matter more than dashboard aesthetics. Incomplete school coverage must be displayed rather than concealed.","nigeria":"Investigate DNEMIS and the data digitization pillar of Nigeria’s education reform programme.","investigate":"Write five essential fields in a non-sensitive school-level record.","checkAnswer":"School identifier, locality, type, reporting date, qualified teacher count and enrolment by grade are examples; minimize personal records.","sources":["edtech"],"minutes":15},{"id":"t12-l03","number":3,"title":"Data protection, privacy and minors","foundation":"Education data can expose information about children, households, disability and performance. A system should collect only what is necessary for a lawful purpose and provide proportionate access controls and retention periods.","mechanism":"Biometric or facial-recognition collection is not justified by convenience alone. Aggregate reporting, pseudonymization, secure storage and strong governance reduce risks.","nigeria":"Before designing school attendance software, ask whether simple class registers meet the requirement without collecting fingerprints.","investigate":"Create a minimal attendance system design with no biometrics.","checkAnswer":"Use school-controlled identifiers, date, class, attendance status, limited access, retention rules and aggregate outputs.","sources":["edtech"],"minutes":15},{"id":"t12-l04","number":4,"title":"Artificial intelligence for teachers and learners","foundation":"AI can help prepare materials, explain concepts, organize information or provide formative practice. It can also hallucinate, reproduce bias, expose personal data and create false impressions of mastery.","mechanism":"Strong use cases include teacher-in-the-loop content drafting, retrieval from approved materials and feedback subject to verification. Assess impact on learning rather than number of chatbot interactions.","nigeria":"Evaluate a Nigeria-specific AI tutor for language inclusion, curriculum alignment, offline accessibility and reliability.","investigate":"Design three checks before trusting an AI-generated history lesson.","checkAnswer":"Compare against primary sources, inspect factual accuracy and coverage, and review for misleading claims or age-inappropriate content.","sources":["edtech"],"minutes":20},{"id":"t12-l05","number":5,"title":"Daily education intelligence and source verification","foundation":"An intelligence system distinguishes official announcements, legal instruments, budgets, release reports, procurement, programme outputs and independently assessed outcomes. Freshness refers to the latest successful source check, not the date an old record was loaded.","mechanism":"Automated feed collection can discover topics, but should not silently convert headlines into verified facts or outcomes. Maintain provenance, last checked timestamps, failed-source notices and editorial review.","nigeria":"A 7 AM national digest should prominently disclose which sources were checked and whether any source failed.","investigate":"Write a two-sentence update for a new programme announcement without claiming it has improved education.","checkAnswer":"Report what agency announced and when; then state which implementation or outcome evidence is still missing.","sources":["edtech"],"minutes":20}]},{"id":"t13","title":"Policy reform, systems research and civic action","purpose":"Use everything learned to evaluate real problems and design credible improvements.","lessons":[{"id":"t13-l01","number":1,"title":"Diagnosing causes instead of symptoms","foundation":"A symptom is an observed problem; a cause is a mechanism producing it. Poor learning scores can arise from multiple interacting causes, so the remedy should follow diagnosis rather than fashion.","mechanism":"Begin with a problem statement including place, affected population, baseline and evidence gaps. Map possible causes, then rank them by evidence and practical leverage rather than assumptions.","nigeria":"For a low-literacy local government, examine teacher deployment, attendance, materials, language, assessment and context before recommending tablets.","investigate":"Write a problem statement with one outcome, one group and one geographical scope.","checkAnswer":"Example: Among Primary 3 pupils in a defined LGA, reading comprehension is below a specified measured threshold in a named year.","sources":["nesri"],"minutes":15},{"id":"t13-l02","number":2,"title":"Theory of change and programme design","foundation":"A theory of change specifies how resources and activities are expected to cause outputs, intermediate outcomes and ultimate outcomes—and the assumptions required at every link.","mechanism":"It should include risks, who implements each action, costs, timing, data sources and a comparison or evaluation strategy. A detailed theory of change is testable, not a decorative flowchart.","nigeria":"Map teacher coaching → improved teaching behaviours → more practice and feedback → higher measured early reading proficiency.","investigate":"List two assumptions that could make this chain fail.","checkAnswer":"Teachers lack time to use coaching; pupils are absent; materials or coaching quality are inadequate.","sources":["nesri"],"minutes":15},{"id":"t13-l03","number":3,"title":"Reading reforms, budgets and accountability records","foundation":"Reform analysis requires triangulation: laws and policies tell you what should happen; budget and procurement records tell you what was planned or bought; implementation and outcome studies show what changed.","mechanism":"Use an evidence register listing claim, source URL, publication date, period covered, geographic scope, confidence and remaining questions. Never treat unsourced social posts as established figures.","nigeria":"Pick one NESRI pillar and build a miniature evidence file with official source and independent assessment where available.","investigate":"For a statement saying “100 schools transformed,” what would you verify?","checkAnswer":"Define transformed, list schools, confirm date and specific outputs, then investigate teaching and learner outcomes.","sources":["nesri"],"minutes":15},{"id":"t13-l04","number":4,"title":"Pilot, evaluate, adapt and scale","foundation":"A promising pilot may fail when scaled because staffing, local language, procurement, transport and supervision differ. Evaluation and adaptation should be planned before expansion.","mechanism":"Scale requires fidelity to the effective mechanism while allowing context-appropriate adaptation. Costs, political continuity, teacher workload and maintenance must be sustainable.","nigeria":"Imagine expanding a 20-school reading programme to 2,000 schools; identify what capacity must grow first.","investigate":"Design three scale-readiness criteria.","checkAnswer":"Verified learning impact, viable per-school costs, and trained management/coaching capacity in the target context.","sources":["nesri"],"minutes":20},{"id":"t13-l05","number":5,"title":"Capstone: your first education intelligence dossier","foundation":"An education intelligence dossier assembles a clear problem, historical background, legal authority, responsible actors, funding trail, current evidence, alternative explanations and actionable recommendations. It is neither a news summary nor an advocacy slogan.","mechanism":"The dossier should give citations for every factual claim, distinguish unknowns, protect personal data and state what evidence would change your conclusion. Include a follow-up plan and transparent limitation section.","nigeria":"Select one state or local education issue, build an evidence trail using government documents, source registry, interviews with consent and independent research.","investigate":"Produce a 2-page dossier: problem, context, stakeholder map, finance stages, learning indicators, options and next questions.","checkAnswer":"A good dossier is reproducible, ethically gathered, honest about uncertainty and actionable by identified institutions.","sources":["nesri"],"minutes":20}]}],"glossary":[{"term":"Access","definition":"Whether a learner has an opportunity to enter education, distinct from attendance and learning."},{"term":"Accountability","definition":"An obligation to explain, justify and where appropriate correct actions and results."},{"term":"Accreditation","definition":"Formal quality review against specified programme or institution standards."},{"term":"Additionality","definition":"The amount of improvement attributable to an intervention beyond what otherwise would have occurred."},{"term":"Appropriation","definition":"Formal authorization within a public budget; not identical to cash release."},{"term":"Attendance rate","definition":"Percentage of scheduled learning sessions attended, with population and period specified."},{"term":"Baseline","definition":"Measurement taken before an intervention for later comparison."},{"term":"Basic education","definition":"Compulsory schooling framework ordinarily covering primary and junior secondary under Nigeria’s UBE Act."},{"term":"Benchmark","definition":"Reference standard used to judge performance; context and method must be specified."},{"term":"Child safeguarding","definition":"Policies and actions to prevent and respond to harm to children."},{"term":"Cohort","definition":"A defined group followed or compared over a time period."},{"term":"Competence","definition":"Ability to perform a task or apply knowledge under relevant conditions."},{"term":"Completion rate","definition":"Proportion of a defined population completing a stage within a stated period."},{"term":"Counterfactual","definition":"What would likely have happened without a programme; central to causal evaluation."},{"term":"Curriculum","definition":"Planned learning goals, content, progressions and experiences."},{"term":"Data dictionary","definition":"Shared definitions of datasets, fields, units, codes and validation rules."},{"term":"Decoding","definition":"Connecting written symbols with spoken sounds to recognize words."},{"term":"Denominator","definition":"The total population or quantity on which a reported rate is based."},{"term":"Disbursement","definition":"Transfer of funds from a financing source to a recipient or implementing entity."},{"term":"Dropout","definition":"Leaving an education pathway before a defined completion point."},{"term":"ECCDE","definition":"Early Childhood Care, Development and Education."},{"term":"EMIS","definition":"Education Management Information System for administrative education data."},{"term":"EdTech","definition":"Educational technology; tools and systems intended to support teaching or learning."},{"term":"Equity","definition":"Fair opportunity through support that responds to unequal needs or constraints."},{"term":"Evaluation","definition":"Systematic investigation of programme design, implementation or effects."},{"term":"Expenditure","definition":"Money actually spent, which must not be conflated with budget allocation."},{"term":"Formative assessment","definition":"Assessment used during learning to guide teaching and feedback."},{"term":"Foundational learning","definition":"Basic literacy, numeracy and other early competencies needed for later learning."},{"term":"Gross enrolment ratio","definition":"All pupils enrolled at a level, regardless of age, divided by the official-age population."},{"term":"Impact","definition":"Longer-term consequences of an intervention; may be hard to attribute."},{"term":"Implementation fidelity","definition":"Extent to which a programme follows core intended practices."},{"term":"Indicator","definition":"Defined measurable quantity used to understand conditions or progress."},{"term":"Interoperability","definition":"Authorized exchange of meaningful and consistent data between systems."},{"term":"LGEA","definition":"Local Government Education Authority, part of local basic-school administration."},{"term":"Learning outcome","definition":"Demonstrated change in knowledge or skill, rather than only activity or attendance."},{"term":"Learning poverty","definition":"A global indicator combining schooling exclusion and insufficient reading proficiency around age 10, subject to specific methodology."},{"term":"Maintenance cost","definition":"Recurring resources needed to keep infrastructure or technology functional."},{"term":"NBTE","definition":"National Board for Technical Education."},{"term":"NCCE","definition":"National Commission for Colleges of Education."},{"term":"NERDC","definition":"Nigerian Educational Research and Development Council, which contributes to curriculum development."},{"term":"NUC","definition":"National Universities Commission."},{"term":"Net enrolment rate","definition":"Share of children of official school age enrolled at the corresponding education level."},{"term":"Opportunity cost","definition":"Value of the next-best use of resources that is forgone by a choice."},{"term":"Outcome","definition":"Change in learner or system condition, such as improved reading proficiency."},{"term":"Output","definition":"Immediate delivered product or service, such as books distributed or teachers trained."},{"term":"Pedagogy","definition":"Methods and principles of teaching."},{"term":"Policy instrument","definition":"An official law, regulation, guideline, policy or directive, each with different authority."},{"term":"Primary source","definition":"Original authoritative record for a claim: law, budget report, ministry publication or direct data."},{"term":"Procurement","definition":"Process for obtaining goods, works or services using established rules."},{"term":"Programme theory","definition":"Explanation of how and why an intervention is expected to produce changes."},{"term":"Pupil–teacher ratio","definition":"Number of enrolled pupils per counted teacher, subject to definition and limitations."},{"term":"Quality assurance","definition":"Processes checking and strengthening standards and performance."},{"term":"Quasi-experiment","definition":"Evaluation that estimates causal effects without random assignment under stated assumptions."},{"term":"Recurrent expenditure","definition":"Continuing operating expenditure such as salary and routine services."},{"term":"Reliability","definition":"Consistency of a measurement under similar conditions."},{"term":"Retention","definition":"Learners remaining in an education pathway over a defined period."},{"term":"SUBEB","definition":"State Universal Basic Education Board, a key basic-education implementing body."},{"term":"School census","definition":"Organized collection of data about schools, facilities, learners and personnel."},{"term":"School readiness","definition":"Developmental foundations for participation in early formal schooling."},{"term":"Social return","definition":"Benefit accruing to society, not just a programme participant."},{"term":"Standardized assessment","definition":"Assessment with consistent administration, scoring and interpretation rules."},{"term":"Summative assessment","definition":"Assessment used to summarize achievement at the end of a learning period."},{"term":"TETFund","definition":"Tertiary Education Trust Fund, supporting eligible tertiary-education interventions."},{"term":"TRCN","definition":"Teachers Registration Council of Nigeria, involved in professional regulation."},{"term":"TVET","definition":"Technical and Vocational Education and Training."},{"term":"Teacher coaching","definition":"Observation, feedback and guided practice intended to improve instruction."},{"term":"UBE","definition":"Universal Basic Education, Nigeria’s free and compulsory basic-education framework."},{"term":"Validity","definition":"Extent to which evidence supports a particular interpretation or use of a measure."},{"term":"WASH","definition":"Water, sanitation and hygiene facilities and practices."}],"sources":[{"id":"policy","title":"National Policy on Education, Federal Ministry of Education","url":"https://education.gov.ng/fme-resources/national-policy-on-education-2014/"},{"id":"ube","title":"Compulsory, Free Universal Basic Education Act 2004 (UBEC)","url":"https://ubec.gov.ng/wp-content/uploads/2021/09/NGA87623-UBE-ACT-2004.pdf"},{"id":"fme","title":"Federal Ministry of Education","url":"https://education.gov.ng/"},{"id":"curriculum","title":"Nigerian Educational Research and Development Council","url":"https://nerdc.gov.ng/"},{"id":"teacher","title":"National Teachers Policy, Federal Ministry of Education","url":"https://education.gov.ng/fme-resources/national-teacher-policy/"},{"id":"unicef","title":"UNICEF: Foundational Literacy and Numeracy in Nigeria (2026)","url":"https://www.unicef.org/nigeria/reports/foundational-literacy-and-numeracy-nigeria"},{"id":"finance","title":"UNICEF: Public Finance for Basic Education in Nigeria (2026)","url":"https://www.unicef.org/nigeria/reports/public-finance-basic-education-nigeria"},{"id":"budget","title":"Budget Office: Quarterly Implementation Reports","url":"https://budgetoffice.gov.ng/index.php/resources/internal-resources/reports/quarterly-budget-implementation"},{"id":"data","title":"Federal Ministry of Education: Education Management Information","url":"https://emis.education.gov.ng/"},{"id":"nesri","title":"Nigeria Education Sector Renewal Initiative: Pillars","url":"https://nesri.education.gov.ng/pillars"},{"id":"nuc","title":"National Universities Commission","url":"https://www.nuc.edu.ng/"},{"id":"nbte","title":"National Board for Technical Education","url":"https://nbte.gov.ng/"},{"id":"ncce","title":"National Commission for Colleges of Education","url":"https://ncce.gov.ng/"},{"id":"tetfund","title":"Tertiary Education Trust Fund","url":"https://www.tetfund.gov.ng/"},{"id":"edtech","title":"Nigeria Education Data Infrastructure reform","url":"https://nesri.education.gov.ng/pillars/data-digitization"},{"id":"gpep","title":"World Bank: Global Education Evidence Advisory Panel","url":"https://www.worldbank.org/en/brief/2025/10/30/global-education-evidence-advisory-panel"},{"id":"safety","title":"Federal Ministry of Education: Basic Education Department","url":"https://education.gov.ng/basic-educationdepartment/"},{"id":"nonstate","title":"National Policy on Non-State Schools","url":"https://education.gov.ng/wp-content/uploads/2026/07/National-Policy-on-Non-State-Schools-With-its-Implementation-Guidelines.pdf"},{"id":"skills","title":"National Policy on Skills Development (2024)","url":"https://education.gov.ng/fme-resources/national-policy-on-skills-development-in-formal-and-non-formal-education-in-nigeria-2024/"}]};
